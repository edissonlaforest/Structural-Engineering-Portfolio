name: LAFOREST AI CI

on:
  workflow_dispatch:
  push:
    paths:
      - "business-intelligence-agent/**"
      - ".github/workflows/laforest-ai-ci.yml"
  pull_request:
    paths:
      - "business-intelligence-agent/**"
      - ".github/workflows/laforest-ai-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: business-intelligence-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: business-intelligence-agent/pyproject.toml
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
