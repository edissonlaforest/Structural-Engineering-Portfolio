[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laforest-engineering-bi"
version = "0.2.0"
description = "Engineering business intelligence, lead CRM, tender monitoring and proposal drafting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0.11", "PyYAML>=6.0.2", "streamlit>=1.39.0", "python-dotenv>=1.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
laforest-bi = "laforest_bi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
